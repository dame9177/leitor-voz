[project]
name = "leitor-voz"
version = "0.1.0"
description = "Leitor de voz para estudo: extensão Firefox + app desktop que lê trechos em voz alta com OpenAI TTS"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "audiotsm>=0.1.2",
    "numpy>=2.4.6",
    "openai>=3.26.1",
    "pyside6>=6.12.0",
    "python-dotenv>=1.2.4",
]

[project.scripts]
leitor = "leitor.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/leitor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
